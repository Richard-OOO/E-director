syntax = "proto3";

package edirector.ai.v1;

option go_package = "github.com/Richard-OOO/E-director/apps/gateway/internal/contracts/ai/v1;aiv1";

// AiGenerationService is the internal contract between the Go Gateway and
// Python AI Worker. The browser-facing API remains HTTP/SSE, while this
// backend-to-backend channel uses gRPC server streaming.
service AiGenerationService {
  rpc GenerateScript(GenerateScriptRequest) returns (stream GenerationStreamEvent);
}

message GenerateScriptRequest {
  string project_id = 1;
  string session_id = 2;
  NovelInput novel = 3;
  GenerationConfig generation_config = 4;
  OutputPreferences output_preferences = 5;
  ClientContext client_context = 6;
}

message NovelInput {
  string title = 1;
  string language = 2;
  string source_type = 3;
  string content = 4;
  int32 chapter_count_hint = 5;
}

message GenerationConfig {
  string target_format = 1;
  string scene_granularity = 2;
  bool enable_dynamic_schema = 3;
  bool enable_design_reasons = 4;
  bool enable_camera_directions = 5;
  bool enable_dialogues = 6;
  bool enable_emotion_tags = 7;
  int32 max_concurrent_chapters = 8;
  int32 max_concurrent_scenes = 9;
  string stream_mode = 10;
}

message OutputPreferences {
  string yaml_style = 1;
  bool include_schema_summary = 2;
  bool include_scene_index = 3;
  bool include_character_registry = 4;
}

message ClientContext {
  string timezone = 1;
  string locale = 2;
  string request_id = 3;
}

message GenerationStreamEvent {
  string event_id = 1;
  string event_type = 2;
  string project_id = 3;
  string job_id = 4;
  string session_id = 5;
  int64 sequence = 6;
  string created_at = 7;

  oneof payload {
    GenerationStartedPayload generation_started = 10;
    ChapterStartedPayload chapter_started = 11;
    SceneStartedPayload scene_started = 12;
    SceneDeltaPayload scene_delta = 13;
    SceneCompletedPayload scene_completed = 14;
    ChapterCompletedPayload chapter_completed = 15;
    SchemaSummaryPayload schema_summary = 16;
    GenerationCompletedPayload generation_completed = 17;
    GenerationFailedPayload generation_failed = 18;
  }
}

message GenerationStartedPayload {
  string status = 1;
  string message = 2;
  int32 estimated_chapter_count = 3;
  int32 estimated_scene_count = 4;
  string stream_mode = 5;
}

message ChapterStartedPayload {
  string chapter_id = 1;
  int32 chapter_index = 2;
  string chapter_title = 3;
  string status = 4;
}

message SceneStartedPayload {
  string chapter_id = 1;
  string chapter_title = 2;
  string scene_id = 3;
  int32 scene_index = 4;
  string scene_title = 5;
  string status = 6;
}

message SceneDeltaPayload {
  string chapter_id = 1;
  string chapter_title = 2;
  string scene_id = 3;
  int32 scene_index = 4;
  int32 delta_index = 5;
  string yaml_content = 6;
  repeated DesignReason design_reasons = 7;
  Progress progress = 8;
}

message SceneCompletedPayload {
  string chapter_id = 1;
  string chapter_title = 2;
  string scene_id = 3;
  int32 scene_index = 4;
  string scene_title = 5;
  string yaml_content = 6;
  repeated DesignReason design_reasons = 7;
  GenerationMetrics metrics = 8;
}

message ChapterCompletedPayload {
  string chapter_id = 1;
  int32 chapter_index = 2;
  string chapter_title = 3;
  string chapter_summary = 4;
  repeated SceneDigest scenes = 5;
  ChapterSchemaDesignNote schema_design_note = 6;
  GenerationMetrics metrics = 7;
}

message SchemaSummaryPayload {
  string schema_version = 1;
  string schema_name = 2;
  string markdown_document = 3;
  repeated FieldDesignReason global_reasons = 4;
  repeated ChapterSchemaDesignNote chapter_notes = 5;
}

message GenerationCompletedPayload {
  string status = 1;
  int32 total_chapters = 2;
  int32 total_scenes = 3;
  int32 completed_scenes = 4;
  int32 failed_scenes = 5;
  string final_output_uri = 6;
  string schema_document_uri = 7;
  GenerationMetrics metrics = 8;
}

message GenerationFailedPayload {
  string status = 1;
  GenerationError error = 2;
}

message DesignReason {
  string reason_id = 1;
  string target_path = 2;
  string field_name = 3;
  string reason_type = 4;
  string title = 5;
  string description = 6;
  string hover_text = 7;
  double confidence = 8;
}

message ChapterSchemaDesignNote {
  string chapter_id = 1;
  string chapter_title = 2;
  string summary = 3;
  repeated FieldDesignReason key_reasons = 4;
}

message FieldDesignReason {
  string field_name = 1;
  string field_type = 2;
  bool required = 3;
  string reason_type = 4;
  string reason = 5;
}

message SceneDigest {
  string scene_id = 1;
  int32 scene_index = 2;
  string title = 3;
  string summary = 4;
}

message Progress {
  int32 completed_chapters = 1;
  int32 total_chapters = 2;
  int32 completed_scenes = 3;
  int32 total_scenes = 4;
  double current_scene_progress = 5;
  double overall_progress = 6;
}

message GenerationMetrics {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 latency_ms = 3;
}

message GenerationError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string chapter_id = 4;
  string scene_id = 5;
}
